; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = main

; Gemeinsame Einstellungen - erben alle Environments weiter unten.
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Version bewusst gepinnt: Arduino-Core ist 2.0.17, ESP32Servo 3.x braucht Core 3.x.
lib_deps =
  madhephaestus/ESP32Servo@^1.2.1
  madhephaestus/ESP32Encoder@^0.10.2

; Das Hauptprogramm: src/main.cpp
[env:main]
build_src_filter = -<*> +<main.cpp>

; Servo-Testprogramm: src/test_servo/
[env:test_servo]
build_src_filter = -<*> +<test_servo/>

; Encoder-Testprogramm: src/test_encoder/
[env:test_encoder]
build_src_filter = -<*> +<test_encoder/>
